<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anchored — FreeDoor Grace v2 "Miss a morning? Your count holds."</title>
<style>
  :root{
    --bg:#12100C; --bg2:#181510; --card:#1C1913; --line:#38311F;
    --gold:#E5B85C; --gold-soft:#C9A24A; --gold-ink:#1A150C;
    --text:#F5F0E6; --muted:#A79B84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1080px;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(85% 55% at 50% -6%, rgba(229,184,92,.22), transparent 60%),
      radial-gradient(120% 80% at 15% 8%, rgba(229,184,92,.08), transparent 55%),
      radial-gradient(140% 120% at 50% 122%, rgba(229,184,92,.05), transparent 60%);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  .frame{
    width:1080px;height:1080px;padding:74px 84px 62px;
    display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
  }
  .brand{font-weight:700;font-size:33px;letter-spacing:-.01em;}
  .brand .dot{color:var(--gold);}
  .overline{
    text-transform:uppercase;letter-spacing:.22em;font-size:17px;font-weight:800;
    color:var(--gold);font-family:-apple-system,"Segoe UI",Arial,sans-serif;margin-top:24px;
  }
  .headline{
    margin-top:12px;font-size:56px;line-height:1.12;font-weight:700;letter-spacing:-.014em;
    max-width:840px;
  }
  .headline .hl{color:var(--gold);font-style:italic;}
  /* scene */
  .scene{flex:1 1 auto;width:100%;position:relative;margin-top:12px;
    display:flex;align-items:center;justify-content:center;}
  /* the phone, hero — the app's own streak screen */
  .phone{
    position:relative;width:308px;height:600px;border-radius:46px;background:#070603;
    border:2px solid #2b2418;padding:15px;
    box-shadow:0 40px 70px rgba(0,0,0,.6), 0 0 0 8px rgba(20,17,11,.55);
    transform:rotate(-2.5deg);
  }
  .screen{
    width:100%;height:100%;border-radius:34px;overflow:hidden;position:relative;
    background:
      radial-gradient(120% 55% at 50% -8%, rgba(229,184,92,.26), transparent 55%),
      linear-gradient(180deg,#1a150d 0%,#0d0a06 64%);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;
  }
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 4px;font-size:13px;color:var(--text);font-weight:600;}
  .statusbar .dots{letter-spacing:2px;}
  .app-hd{display:flex;flex-direction:column;align-items:center;padding:10px 0 12px;border-bottom:1px solid rgba(255,255,255,.06);}
  .app-hd .seal{width:44px;height:44px;border-radius:12px;background:linear-gradient(160deg,var(--gold),#b98a34);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(0,0,0,.4);margin-bottom:7px;}
  .app-hd .seal svg{width:25px;height:25px;}
  .app-hd .nm{font-size:16px;font-weight:800;color:var(--text);letter-spacing:.01em;}
  .app-hd .st{font-size:11px;color:var(--muted);margin-top:2px;letter-spacing:.04em;}
  .streak{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:26px 20px 0;}
  .bignum{font-size:118px;font-weight:800;line-height:.9;color:var(--gold);text-shadow:0 0 40px rgba(229,184,92,.4);font-family:Georgia,serif;}
  .biglbl{font-size:16px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px;}
  .strip{display:flex;gap:10px;margin-top:30px;justify-content:center;}
  .d{width:32px;display:flex;flex-direction:column;align-items:center;gap:7px;}
  .d .lab{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;}
  .d .mk{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .d.kept .mk{background:linear-gradient(160deg,var(--gold),#b98a34);box-shadow:0 4px 12px rgba(229,184,92,.35);}
  .d.kept .mk svg{width:17px;height:17px;}
  .d.miss .mk{background:transparent;border:2px dashed #5a4d31;}
  .d.today .mk{background:linear-gradient(160deg,var(--gold),#b98a34);box-shadow:0 0 0 5px rgba(229,184,92,.16),0 4px 12px rgba(229,184,92,.4);}
  .d.today .mk svg{width:17px;height:17px;}
  .d.today .lab{color:var(--gold);}
  .chip{margin:30px 16px 0;background:rgba(229,184,92,.10);border:1px solid rgba(229,184,92,.30);
    border-radius:16px;padding:14px 16px;text-align:center;}
  .chip .big{font-size:16px;font-weight:800;color:var(--gold);}
  .chip .small{font-size:13px;color:#D9CFBB;margin-top:4px;line-height:1.35;}
  .foot{
    position:absolute;bottom:6px;left:0;right:0;text-align:center;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:17px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">Anchored<span class="dot">.</span></div>
    <div class="overline">Missed a morning?</div>
    <div class="headline">Your count <span class="hl">doesn&rsquo;t reset.</span></div>

    <div class="scene">
      <div class="phone">
        <div class="screen">
          <div class="statusbar"><span>7:03</span><span class="dots">&#9679;&#9679;&#9679; &#9662;</span></div>
          <div class="app-hd">
            <div class="seal">
              <svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="4.2" r="1.9"/><line x1="12" y1="6.1" x2="12" y2="21"/>
                <line x1="7.5" y1="10" x2="16.5" y2="10"/>
                <path d="M4.5 14.5c0 4 3.4 6.2 7.5 6.2s7.5-2.2 7.5-6.2"/>
                <path d="M4.5 14.5l-2 .8 2 1.9M19.5 14.5l2 .8-2 1.9"/>
              </svg>
            </div>
            <div class="nm">Your mornings</div>
            <div class="st">ANCHORED</div>
          </div>
          <div class="streak">
            <div class="bignum">14</div>
            <div class="biglbl">mornings kept</div>
            <div class="strip">
              <div class="d kept"><span class="lab">M</span><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
              <div class="d kept"><span class="lab">T</span><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
              <div class="d miss"><span class="lab">W</span><span class="mk"></span></div>
              <div class="d kept"><span class="lab">T</span><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
              <div class="d kept"><span class="lab">F</span><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
              <div class="d today"><span class="lab">S</span><span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg></span></div>
            </div>
            <div class="chip">
              <div class="big">Missed Wednesday. Count held.</div>
              <div class="small">No reset. No catch-up days. You just open the next morning.</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="foot">anchoredfaith.app</div>
  </div>
</body>
</html>
