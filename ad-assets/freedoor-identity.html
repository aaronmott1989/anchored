<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Anchored — FreeDoor Identity "Who are you when nobody's watching?"</title>
<style>
  :root{
    --bg:#12100C; --bg2:#181510; --card:#1C1913; --line:#38311F;
    --gold:#E5B85C; --gold-soft:#C9A24A; --gold-ink:#1A150C;
    --text:#F5F0E6; --muted:#A79B84;
    --page:#F5EAD2; --page2:#E7D8B4; --page-ink:#2A2313;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1080px;height:1080px;}
  body{
    background:var(--bg);
    background-image:
      radial-gradient(85% 55% at 50% -6%, rgba(229,184,92,.22), transparent 60%),
      radial-gradient(120% 80% at 15% 8%, rgba(229,184,92,.07), transparent 55%),
      radial-gradient(150% 130% at 50% 64%, rgba(229,184,92,.05), transparent 62%);
    color:var(--text);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
    overflow:hidden;
  }
  .frame{
    width:1080px;height:1080px;padding:70px 84px 98px;
    display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;
  }
  .brand{font-weight:700;font-size:33px;letter-spacing:-.01em;}
  .brand .dot{color:var(--gold);}
  .overline{
    letter-spacing:-.01em;font-size:30px;font-weight:400;font-style:italic;
    color:var(--muted);margin-top:24px;
  }
  .headline{
    margin-top:14px;font-size:58px;line-height:1.11;font-weight:700;letter-spacing:-.015em;
    max-width:860px;
  }
  .headline .hl{color:var(--gold);font-style:italic;}
  /* scene */
  .scene{flex:1 1 auto;width:100%;position:relative;margin-top:6px;
    display:flex;align-items:center;justify-content:center;}
  .stage{position:relative;width:600px;height:380px;}
  /* dawn sun rising behind the card */
  .sun{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:150px;height:150px;}
  .sun .orb{position:absolute;left:33px;top:33px;width:84px;height:84px;border-radius:50%;
    background:radial-gradient(circle at 50% 42%, #FCE4A6, var(--gold));
    box-shadow:0 0 60px rgba(229,184,92,.8), 0 0 140px rgba(229,184,92,.4);}
  .sun .ray{position:absolute;left:71px;top:0;width:6px;height:18px;border-radius:4px;
    background:linear-gradient(180deg,var(--gold),rgba(229,184,92,.12));transform-origin:4px 75px;opacity:.85;}
  /* the "kept word" card — paper */
  .card{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:452px;border-radius:16px;overflow:hidden;text-align:left;
    background:linear-gradient(180deg,var(--page),var(--page2));
    box-shadow:0 34px 66px rgba(0,0,0,.6), 0 0 0 1px rgba(229,184,92,.18), 0 0 50px rgba(229,184,92,.14);}
  .card .top{display:flex;align-items:center;gap:14px;padding:22px 26px 16px;border-bottom:1px solid rgba(120,100,58,.28);}
  .card .check{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    background:linear-gradient(160deg,var(--gold),#b98a34);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.28);}
  .card .check svg{width:30px;height:30px;}
  .card .top .meta{flex:1 1 auto;}
  .card .top .k{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:14px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#7a6432;}
  .card .top .t{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;font-weight:700;color:var(--page-ink);margin-top:3px;}
  .card .quote{padding:22px 28px 8px;font-family:Georgia,serif;font-size:29px;font-weight:700;line-height:1.24;color:var(--page-ink);}
  .card .tally{display:flex;align-items:center;gap:13px;padding:12px 28px 24px;}
  .card .tally .dots{display:flex;gap:7px;}
  .card .tally .dot{width:11px;height:11px;border-radius:50%;background:#c2a24f;box-shadow:0 1px 2px rgba(0,0,0,.15);}
  .card .tally .lbl{font-family:-apple-system,"Segoe UI",Arial,sans-serif;font-size:15px;font-weight:800;color:#7a6432;letter-spacing:.03em;}
  .sub{
    margin-top:18px;font-size:27px;line-height:1.38;font-weight:400;color:var(--text);max-width:800px;
  }
  .sub b{color:var(--gold);font-weight:700;font-style:italic;}
  .foot{
    position:absolute;bottom:3.4%;left:0;right:0;text-align:center;
    font-family:-apple-system,"Segoe UI",Arial,sans-serif;
    font-size:17px;font-weight:600;letter-spacing:.04em;color:var(--muted);
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">Anchored<span class="dot">.</span></div>
    <div class="overline">Who are you when nobody&rsquo;s watching?</div>
    <div class="headline">Become the man who keeps the <span class="hl">quiet morning.</span></div>

    <div class="scene">
      <div class="stage">
        <div class="sun" id="sun"></div>
        <div class="card">
          <div class="top">
            <div class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="#1A150C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
            </div>
            <div class="meta">
              <div class="k">Morning kept</div>
              <div class="t">Today &middot; 5:47 AM</div>
            </div>
          </div>
          <div class="quote">&ldquo;Before the day got loud, I showed up.&rdquo;</div>
          <div class="tally">
            <div class="dots">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </div>
            <div class="lbl">18 mornings kept</div>
          </div>
        </div>
      </div>
    </div>

    <div class="sub">Not a person on your back &mdash; <b>a rhythm you keep.</b> Five free mornings; the first lands tomorrow.</div>

    <div class="foot">anchoredfaith.app</div>
  </div>
  <script>
    var sun=document.getElementById('sun');
    for(var i=0;i<10;i++){var r=document.createElement('div');r.className='ray';r.style.transform='rotate('+(i*36-90)+'deg)';sun.appendChild(r);}
    var orb=document.createElement('div');orb.className='orb';sun.appendChild(orb);
  </script>
</body>
</html>
